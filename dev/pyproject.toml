[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "browser-node-harness"
version = "0.1.0"
description = "Parallel coding-agent harness for driving a browser-native Node.js runtime against the upstream Node.js test suite"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenAI" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
bnh = "browser_node_harness.cli:main"

[tool.setuptools]
package-dir = { "" = "harness" }

[tool.setuptools.packages.find]
where = ["harness"]
